name: Expand packaged site
on:
  push:
    branches: [rebuild-2026]
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-2026
      - name: Expand ZIP over branch
        run: |
          test -f LaTegalaSite.zip
          rm -rf /tmp/lategala_expand
          mkdir -p /tmp/lategala_expand
          unzip -q -o LaTegalaSite.zip -d /tmp/lategala_expand
          if [ -d /tmp/lategala_expand/LaTegalaSite_2026 ]; then
            cp -a /tmp/lategala_expand/LaTegalaSite_2026/. .
          else
            cp -a /tmp/lategala_expand/. .
          fi
      - name: Commit expanded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Expand complete 2026 site package"
            git push origin HEAD:rebuild-2026
          fi
