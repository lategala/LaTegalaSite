name: Generate professional PDFs

on:
  push:
    branches:
      - rebuild-2026
    paths:
      - scripts/generate_professional_pdfs.py
      - .github/workflows/generate-professional-pdfs.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-2026
      - name: Install dependencies
        run: |
          python -m pip install --quiet reportlab
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Generate PDFs
        run: python scripts/generate_professional_pdfs.py
      - name: Validate PDFs
        run: |
          for f in downloads/uploads/ficha-artistica-tecnica-la-parte-que-falta.pdf downloads/uploads/ficha-artistica-tecnica-que-diablos.pdf downloads/uploads/rider-iluminacion-pagina-disponible-que-diablos.pdf; do
            pdfinfo "$f" >/dev/null
            test "$(stat -c%s "$f")" -gt 1000
          done
      - name: Commit generated files
        run: |
          git config user.name "La Tegala Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/uploads/*.pdf
          git diff --cached --quiet || git commit -m "Generate professional PDF downloads"
          git push
