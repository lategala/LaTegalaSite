name: Import public theatre artwork
on:
  push:
    branches: [refine-2026-10-01]
    paths:
      - '.github/workflows/import-public-artwork.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-2026-10-01
      - name: Download public artwork
        shell: python
        run: |
          import urllib.request, pathlib
          items={
            "assets/public-qd.jpg":"https://www.ecoentradas.com/cartel/sPQtvPVX/treatedjrDvLo8s.jpg",
            "assets/public-sueno.jpg":"https://www.ayuntamientodeharia.com/haria/wp-content/uploads/2025/06/El-sueno-de-una-noche-de-San-Juan.jpg",
            "assets/public-caleidoscopio.jpg":"https://www.ayuntamientodeharia.com/haria/wp-content/uploads/2024/05/CartelCALEIDOSCOPIO-212x300-1.jpg",
            "assets/public-principita.jpg":"https://www.masscultura.com/mass/wp-content/uploads/2023/03/WhatsApp-Image-2023-02-27-at-20.45.55.jpeg"
          }
          for path,url in items.items():
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            data=urllib.request.urlopen(req,timeout=30).read()
            p=pathlib.Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
            print(path,len(data))
      - name: Commit artwork
        run: |
          git config user.name "La Tegala web bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/public-*.jpg
          git diff --cached --quiet || git commit -m "Import public theatre artwork"
          git push origin HEAD:refine-2026-10-01
