name: Import public company logo
on:
  push:
    branches: [refine-2026-10-01]
    paths:
      - '.github/workflows/import-public-logo.yml'
permissions:
  contents: write
jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-2026-10-01
      - name: Download Facebook profile image
        shell: python
        run: |
          import html as htmllib, re, urllib.request, pathlib
          url="https://www.facebook.com/profile.php?id=61594400188184"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          text=urllib.request.urlopen(req,timeout=25).read().decode("utf-8","ignore")
          m=re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',text,re.I)
          if not m:
              m=re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',text,re.I)
          if not m: raise SystemExit("No og:image")
          img=htmllib.unescape(m.group(1))
          req=urllib.request.Request(img,headers={"User-Agent":"Mozilla/5.0","Referer":"https://www.facebook.com/"})
          data=urllib.request.urlopen(req,timeout=30).read()
          p=pathlib.Path("assets/logo-social.jpg"); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
          print("saved",len(data),img)
      - name: Commit logo
        run: |
          git config user.name "La Tegala web bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/logo-social.jpg
          git diff --cached --quiet || git commit -m "Import public La Tegala profile logo"
          git push origin HEAD:refine-2026-10-01
