name: Inspect event image candidates
on:
  push:
    branches: [refine-2026-10-01]
    paths:
      - '.github/workflows/inspect-event-images.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect image URLs
        shell: python
        run: |
          import re, urllib.request, html, urllib.parse
          pages=[
            ("qd","https://www.ecoentradas.com/elegirzona/3590"),
            ("sueno","https://www.ayuntamientodeharia.com/haria/la-escuela-de-teatro-de-haria-representa-el-sueno-de-una-noche-de-verano/"),
            ("caleido","https://www.ayuntamientodeharia.com/haria/el-ayuntamiento-de-haria-presenta-la-obra-de-teatro-caleidoscopio/"),
            ("asolas","https://www.masscultura.com/festival-escenica-2025-en-haria/"),
            ("principita","https://www.masscultura.com/escenica-abril-2023-haria/")
          ]
          for label,url in pages:
            print("\nPAGE",label,url)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              txt=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")
              txt=html.unescape(txt).replace("\\/","/")
              vals=[]
              for pattern in [r'<img[^>]+src=["\']([^"\']+)',r'<meta[^>]+content=["\']([^"\']+\.(?:jpg|jpeg|png|webp)[^"\']*)']:
                vals += re.findall(pattern,txt,re.I)
              seen=[]
              for x in vals:
                x=urllib.parse.urljoin(url,x)
                if x not in seen: seen.append(x)
              print("count",len(seen))
              for i,x in enumerate(seen[:60]): print(i,x[:700])
            except Exception as e:
              print("ERROR",repr(e))
