name: Inspect Facebook image candidates
on:
  push:
    branches: [refine-2026-10-01]
    paths:
      - '.github/workflows/inspect-facebook-images.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect
        shell: python
        run: |
          import re, urllib.request, html
          url="https://www.facebook.com/profile.php?id=61594400188184"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          txt=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")
          txt=html.unescape(txt).replace("\\/","/")
          urls=re.findall(r'https://[^"\'<> ]+?\.(?:jpg|jpeg|png)(?:\?[^"\'<> ]*)?',txt,re.I)
          seen=[]
          for u in urls:
            if u not in seen: seen.append(u)
          print("count",len(seen))
          for i,u in enumerate(seen[:80]):
            print(i,u[:500])
