name: Inspect Haría Facebook
on:
  push:
    branches: [refine-2026-10-01]
    paths: ['.github/workflows/inspect-haria-facebook.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public page
        shell: python
        run: |
          import re,urllib.request,html
          urls=[
            "https://www.facebook.com/la.tegala.escuela.de.teatro.de.haria/",
            "https://m.facebook.com/la.tegala.escuela.de.teatro.de.haria/",
            "https://mbasic.facebook.com/la.tegala.escuela.de.teatro.de.haria/"
          ]
          for url in urls:
            print("\nPAGE",url)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              txt=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")
              txt=html.unescape(txt).replace("\\/","/")
              print("html",len(txt))
              vals=re.findall(r'https://[^"\'<> ]+?\.(?:jpg|jpeg|png)(?:\?[^"\'<> ]*)?',txt,re.I)
              seen=[]
              for u in vals:
                if u not in seen: seen.append(u)
              print("images",len(seen))
              for i,u in enumerate(seen[:100]): print(i,u[:800])
            except Exception as e: print("ERROR",repr(e))
