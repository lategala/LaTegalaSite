name: Inspect legacy assets zip
# trigger
on:
  push:
    branches: [refine-2026-10-01]
    paths:
      - '.github/workflows/inspect-legacy-zip.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-2026-10-01
      - name: List archive
        run: |
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('legacy-assets.zip')
          print('COUNT',len(z.infolist()))
          for x in z.infolist():
              print(x.file_size, x.filename)
          PY
