name: Inspect Haría YouTube dates
on:
  push:
    branches: [refine-2026-10-01]
    paths:
      - '.github/workflows/inspect-youtube-dates.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp
        run: python -m pip install -q yt-dlp
      - name: Inspect dates
        run: |
          for id in zZC0sLs8-Vs zyVlAMK4GdU h8k2dEwKL68 ECw5X-Jr3CE Q2ej73rR8Ks _ha1d7tUBZk wZGdh2hZlo4 D0KYKLmRxto THIadNzTiAk HiFLp48VSJI 7IBluyxcAhk; do
            yt-dlp --skip-download --no-warnings --print "%(id)s|%(upload_date)s|%(title)s" "https://www.youtube.com/watch?v=$id" || true
          done
