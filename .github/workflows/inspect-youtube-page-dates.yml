name: Inspect selected YouTube page dates
on:
  push:
    branches: [refine-2026-10-01]
    paths:
      - '.github/workflows/inspect-youtube-page-dates.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dates from HTML
        shell: python
        run: |
          import re, urllib.request
          ids=["Q2ej73rR8Ks","7IBluyxcAhk"]
          for vid in ids:
              url="https://www.youtube.com/watch?v="+vid
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"es-ES,es;q=0.9,en;q=0.8"})
              try:
                  txt=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")
                  vals=[]
                  for pat in [r'"publishDate":"([^"]+)"',r'"uploadDate":"([^"]+)"',r'itemprop="datePublished" content="([^"]+)"']:
                      vals+=re.findall(pat,txt)
                  print(vid,vals[:10],"len",len(txt))
              except Exception as e:
                  print(vid,"ERROR",repr(e))
