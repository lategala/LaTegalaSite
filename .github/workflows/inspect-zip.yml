name: Inspect packaged ZIP
on:
  push:
    branches: [rebuild-2026]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-2026
      - name: List ZIP contents
        run: |
          unzip -l LaTegalaSite.zip > zip-contents.txt
      - name: Commit listing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zip-contents.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Inspect packaged site ZIP"
            git push origin HEAD:rebuild-2026
          fi
