name: Validate site
on:
  push:
    branches: [main, refine-2026-10-01, final-refine-2026-10-01]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site structure and scripts
        run: python scripts/validate_site.py
      - name: Package final ZIP
        if: success()
        run: |
          zip -r LaTegalaSite_2026_FINAL.zip . -x ".git/*" ".github/workflows/inspect-*.yml" "LaTegalaSite_2026_FINAL.zip"
      - name: Upload final ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LaTegalaSite_2026_FINAL
          path: LaTegalaSite_2026_FINAL.zip
