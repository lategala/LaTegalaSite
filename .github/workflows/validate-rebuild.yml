name: Validate rebuild
on:
  push:
    branches: [rebuild-2026]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-2026
      - name: Validate site structure and scripts
        run: python scripts/validate_site.py
      - name: Package final ZIP
        if: success()
        run: |
          zip -r LaTegalaSite_2026_FINAL.zip . -x ".git/*" ".github/workflows/expand-site.yml" ".github/workflows/inspect-zip.yml" "zip-contents.txt" "__write_test.txt" "LaTegalaSite.zip"
      - name: Upload final ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LaTegalaSite_2026_FINAL
          path: LaTegalaSite_2026_FINAL.zip
