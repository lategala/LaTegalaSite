<div class="lang-switch">
  <label class="small" for="langSel" style="margin-right:6px;">🌐</label>
  <select id="langSel" aria-label="Seleccionar idioma">
    <option value="es">Español</option>
    <option value="en">English</option>
    <option value="fr">Français</option>
    <option value="de">Deutsch</option>
  </select>
</div>

<script>
function applyI18n(dict, lang){
  if(!dict[lang]) return;
  document.documentElement.setAttribute('lang', lang);
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    if(dict[lang][key]) el.innerHTML = dict[lang][key];
  });
}
(function(){
  var sel = document.getElementById('langSel');
  var saved = localStorage.getItem('lang') || 'es';
  sel.value = saved;
  sel.addEventListener('change', function(){ localStorage.setItem('lang', this.value); location.reload(); });
})();
</script>
