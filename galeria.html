<script>
function lightbox(sel){{document.querySelectorAll(sel).forEach(el=>{{el.addEventListener('click',()=>{{const m=document.createElement('div');m.className='lightbox-modal show';const im=document.createElement('img');im.src=el.src;m.appendChild(im);m.addEventListener('click',()=>m.remove());document.body.appendChild(m);}});}});}}
lightbox('.thumb');
</script>
