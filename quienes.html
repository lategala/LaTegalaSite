<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="La Tegala Escénica y Antonio Orellana."><title>La Tegala · La Tegala Escénica</title><meta name="keywords" content="La Tegala Escénica, La Tegala, Tegala, asociación cultural, asociación cultural Lanzarote, teatro Lanzarote, compañía teatral Lanzarote, Teguise, teatro Teguise, artes escénicas, formación teatral"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://lategala.github.io/LaTegalaSite/quienes.html"><meta property="og:type" content="website"><meta property="og:site_name" content="La Tegala Escénica"><meta property="og:url" content="https://lategala.github.io/LaTegalaSite/quienes.html"><meta property="og:title" content="La Tegala · La Tegala Escénica"><meta property="og:description" content="La Tegala Escénica y Antonio Orellana."><meta property="og:image" content="https://lategala.github.io/LaTegalaSite/assets/uploads/images/logo-lategala-dark.webp"><link rel="stylesheet" href="style.css"><script>window.PAGE_I18N={"es":{"ey":"Quiénes somos","title":"La Tegala Escénica","lead":"Un círculo artístico que acoge, crea y transforma.","p1":"La Asociación Cultural La Tegala Escénica, fundada en 2024 en Teguise, Lanzarote, toma su nombre de una palabra de origen prehispánico que representa un redil o refugio improvisado de piedra para vigilancia y resguardo del viento. Esa imagen resume su vocación: ser un espacio de protección, reunión y creación para la comunidad y las ideas.","p2":"Bajo la dirección de Antonio Orellana, La Tegala combina talento local y experiencia profesional para impulsar montajes teatrales, formación y proyectos culturales con vocación insular y canaria.","antonio":"Antonio Orellana","abio":"Creador escénico, actor, dramaturgo y director con más de tres décadas de experiencia. Licenciado en Filología Hispánica y Máster en Artes del Espectáculo Vivo, Premio Extraordinario. Su trayectoria incluye compañías y proyectos en distintos puntos de España, así como el Premio de Letras Canarias Benito Pérez Armas y otros reconocimientos nacionales.","island":"Impulso teatral en Lanzarote","islandp":"En Lanzarote ha desarrollado proyectos como la Escuela de Teatro de Haría desde 2021, la Escuela de Teatro Aspercan Lanzarote en 2023 y la Escuela de Teatro de La Graciosa desde el curso 2026–2027.","mission":"Misión","missionp":"Explorar nuevas formas de expresión artística y fortalecer el teatro isleño desde un enfoque profesional y comprometido, tanto a través de montajes como <em>La Parte Que Falta</em> y <em>¡Qué Diablos!</em> como mediante proyectos de formación y creación comunitaria."},"en":{"ey":"About","title":"La Tegala Escénica","lead":"An artistic circle that welcomes, creates and transforms.","p1":"La Tegala Escénica Cultural Association was founded in 2024 in Teguise, Lanzarote. Its name comes from a pre-Hispanic word for a simple stone shelter used for watch and protection from the wind. This image reflects its vocation: a place of shelter, gathering and creation for community and ideas.","p2":"Under the direction of Antonio Orellana, La Tegala combines local talent and professional experience to develop theatre productions, training and cultural projects with an island-wide and Canary Islands perspective.","antonio":"Antonio Orellana","abio":"Stage creator, actor, playwright and director with more than three decades of experience. Degree in Hispanic Philology and Master’s in Live Performing Arts, awarded with distinction. His career includes companies and projects across Spain, the Benito Pérez Armas Canary Islands Literature Prize and other national recognitions.","island":"Theatre development in Lanzarote","islandp":"In Lanzarote he has developed projects including the Haría Theatre School since 2021, Aspercan Lanzarote Theatre School in 2023 and La Graciosa Theatre School from the 2026–2027 season.","mission":"Mission","missionp":"To explore new forms of artistic expression and strengthen island theatre through a professional and committed approach, both through productions such as <em>La Parte Que Falta</em> and <em>¡Qué Diablos!</em> and through training and community creation."},"fr":{"ey":"Qui sommes-nous","title":"La Tegala Escénica","lead":"Un cercle artistique qui accueille, crée et transforme.","p1":"L’Association Culturelle La Tegala Escénica a été fondée en 2024 à Teguise, Lanzarote. Son nom vient d’un mot préhispanique désignant un abri de pierre improvisé pour la surveillance et la protection contre le vent. Cette image résume sa vocation : un espace de refuge, de rencontre et de création pour la communauté et les idées.","p2":"Sous la direction d’Antonio Orellana, La Tegala associe talent local et expérience professionnelle pour développer spectacles, formations et projets culturels à l’échelle insulaire et canarienne.","antonio":"Antonio Orellana","abio":"Créateur scénique, acteur, dramaturge et metteur en scène avec plus de trente ans d’expérience. Diplômé en Philologie hispanique et Master en Arts du spectacle vivant, Prix extraordinaire.","island":"Dynamisation théâtrale à Lanzarote","islandp":"À Lanzarote, il a développé l’École de théâtre de Haría depuis 2021, l’École Aspercan Lanzarote en 2023 et l’École de théâtre de La Graciosa à partir de 2026–2027.","mission":"Mission","missionp":"Explorer de nouvelles formes d’expression artistique et renforcer le théâtre insulaire avec une approche professionnelle et engagée, à travers les spectacles et la formation communautaire."},"de":{"ey":"Über uns","title":"La Tegala Escénica","lead":"Ein künstlerischer Kreis, der aufnimmt, schafft und verwandelt.","p1":"Der Kulturverein La Tegala Escénica wurde 2024 in Teguise, Lanzarote, gegründet. Der Name stammt aus einem vorspanischen Begriff für einen einfachen Steinschutz gegen Wind und für die Wache. Dieses Bild steht für Schutz, Begegnung und künstlerische Kreation.","p2":"Unter der Leitung von Antonio Orellana verbindet La Tegala lokales Talent mit professioneller Erfahrung und entwickelt Produktionen, Ausbildung und Kulturprojekte.","antonio":"Antonio Orellana","abio":"Bühnenkünstler, Schauspieler, Dramatiker und Regisseur mit mehr als drei Jahrzehnten Erfahrung. Studium der Hispanistik und Master in Live Performing Arts mit Auszeichnung.","island":"Theaterarbeit auf Lanzarote","islandp":"Zu seinen Projekten gehören die Theaterschule Haría seit 2021, Aspercan Lanzarote 2023 und die Theaterschule La Graciosa ab 2026–2027.","mission":"Mission","missionp":"Neue künstlerische Ausdrucksformen erforschen und das Inseltheater professionell und engagiert stärken – durch Produktionen ebenso wie durch Ausbildung und Gemeinschaftsprojekte."},"it":{"ey":"Chi siamo","title":"La Tegala Escénica","lead":"Un cerchio artistico che accoglie, crea e trasforma.","p1":"L’Associazione Culturale La Tegala Escénica nasce nel 2024 a Teguise, Lanzarote. Il nome deriva da una parola preispanica che indica un semplice rifugio di pietra per la vigilanza e la protezione dal vento. Questa immagine esprime la vocazione della compagnia: protezione, incontro e creazione.","p2":"Sotto la direzione di Antonio Orellana, La Tegala unisce talento locale ed esperienza professionale per sviluppare spettacoli, formazione e progetti culturali.","antonio":"Antonio Orellana","abio":"Creatore scenico, attore, drammaturgo e regista con oltre trent’anni di esperienza. Laurea in Filologia Ispanica e Master in Arti dello Spettacolo dal Vivo, Premio Straordinario.","island":"Sviluppo teatrale a Lanzarote","islandp":"A Lanzarote ha sviluppato la Scuola di Teatro di Haría dal 2021, Aspercan Lanzarote nel 2023 e la Scuola di Teatro La Graciosa dal 2026–2027.","mission":"Missione","missionp":"Esplorare nuove forme di espressione artistica e rafforzare il teatro insulare con un approccio professionale e impegnato, attraverso spettacoli, formazione e creazione comunitaria."}}</script><script defer src="site.js"></script></head><body><div id="site-header"></div><main id="contenido"><section class="section"><div class="wrap"><div class="eyebrow" data-i18n="ey"></div><h1 class="display small" data-i18n="title"></h1><p class="lead" data-i18n="lead"></p><div class="split" style="margin-top:44px"><div class="prose"><p data-i18n="p1"></p><p data-i18n="p2"></p></div><div class="visual-panel"><div class="vp"><h3>La Tegala</h3><p class="muted">Teguise · Lanzarote · 2024</p></div></div></div></div></section><section class="section"><div class="wrap split"><div class="card"><div class="media"><img src="assets/director1.jpg" alt="Antonio Orellana"></div></div><div><div class="eyebrow" data-i18n="antonio"></div><h2 data-i18n="antonio"></h2><p class="lead" data-i18n="abio"></p><div class="actions"><a class="btn primary" href="antonio-orellana.html">Formación y servicios</a><a class="btn ghost" data-mail-subject="Solicitud de CV · Antonio Orellana" data-common="requestcv"></a></div></div></div></section><section class="section"><div class="wrap grid two"><div class="card"><div class="card-body"><h3 data-i18n="island"></h3><p data-i18n="islandp"></p></div></div><div class="card"><div class="card-body"><h3 data-i18n="mission"></h3><p data-i18n="missionp"></p></div></div></div></section></main><div id="site-footer"></div></body></html>
